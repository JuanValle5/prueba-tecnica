server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: fixlat-portal-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fixlat_db}
    username: ${DB_USER:fixlat_user}
    password: ${DB_PASSWORD:fixlat_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000,http://127.0.0.1:5173}
  demo:
    admin-email: admin@fixlat.com
    admin-password: Admin123!
    admin-name: Administrador FIXLAT
    user-email: user@fixlat.com
    user-password: User123!
    user-name: Usuario Demostración
