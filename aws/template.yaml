AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  FIXLAT Portal - Infraestructura en AWS con AWS SAM y CloudFormation
  Incluye: S3 + CloudFront (Frontend), EC2 con Docker (Backend Spring Boot),
  RDS PostgreSQL (Base de datos) y AWS Lambda (Métricas Dashboard).

Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: Nombre del entorno de despliegue (dev, staging, prod)

  DBPassword:
    Type: String
    NoEcho: true
    Default: FixlatSecurePass2026!
    Description: Contraseña para la base de datos PostgreSQL

  EC2InstanceType:
    Type: String
    Default: t3.micro
    Description: Tipo de instancia para el contenedor de la API

Resources:
  # ============================================================================
  # 1. FRONTEND: S3 + CloudFront
  # ============================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'fixlat-portal-frontend-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'fixlat-oac-${EnvironmentName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: Distribución CDN para el frontend FIXLAT
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  # ============================================================================
  # 2. BASE DE DATOS: RDS PostgreSQL
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes para RDS PostgreSQL
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso a base de datos PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  PostgresDB:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'fixlat-db-${EnvironmentName}'
      Engine: postgres
      EngineVersion: '16.3'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      DBName: fixlat_db
      MasterUsername: fixlat_user
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      SkipFinalSnapshot: true
      DeleteAutomatedBackups: true

  # ============================================================================
  # 3. BACKEND: EC2 con Contenedor Docker (API Spring Boot)
  # ============================================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Seguridad para EC2 API Docker
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  EC2InstanceProfileRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceProfileRole

  BackendEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      ImageId: ami-0c7217cdde317cfec # Ubuntu 22.04 LTS (us-east-1 standard)
      SubnetId: !Ref PublicSubnet1
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          apt-get install -y docker.io git
          systemctl start docker
          systemctl enable docker
          # Descarga y levantamiento del contenedor Docker del backend
          docker run -d \
            --name fixlat-backend \
            --restart always \
            -p 80:8080 \
            -e DB_HOST=${PostgresDB.Endpoint.Address} \
            -e DB_PORT=5432 \
            -e DB_NAME=fixlat_db \
            -e DB_USER=fixlat_user \
            -e DB_PASSWORD=${DBPassword} \
            -e LAMBDA_METRICS_URL=${DashboardMetricsApi.ServerlessDeployment} \
            juanvalencia/fixlat-backend:latest
      Tags:
        - Key: Name
          Value: !Sub 'fixlat-backend-ec2-${EnvironmentName}'

  # ============================================================================
  # 4. SERVERLESS: AWS Lambda para Métricas del Dashboard
  # ============================================================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Seguridad para Lambda en VPC
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  DashboardMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'fixlat-dashboard-metrics-${EnvironmentName}'
      CodeUri: ../lambda-metrics/
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 10
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
      Environment:
        Variables:
          DB_HOST: !GetAtt PostgresDB.Endpoint.Address
          DB_PORT: '5432'
          DB_NAME: fixlat_db
          DB_USER: fixlat_user
          DB_PASSWORD: !Ref DBPassword
      Events:
        GetMetrics:
          Type: Api
          Properties:
            Path: /metrics
            Method: GET
            RestApiId: !Ref DashboardMetricsApi

  DashboardMetricsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref EnvironmentName
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ============================================================================
  # 5. NETWORKING: VPC Básica y Subredes Públicas
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'fixlat-vpc-${EnvironmentName}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Subnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTable

  Subnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTable

# ============================================================================
# SALIDAS (OUTPUTS)
# ============================================================================
Outputs:
  FrontendCloudFrontURL:
    Description: URL pública del Frontend distribuido en CloudFront
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  FrontendS3BucketName:
    Description: Nombre del Bucket S3 de alojamiento del Frontend
    Value: !Ref FrontendBucket

  BackendAPIEndpoint:
    Description: Dirección IP pública del servidor EC2 con la API Dockerizada
    Value: !Sub 'http://${BackendEC2Instance.PublicIp}'

  LambdaMetricsEndpoint:
    Description: Endpoint HTTP de AWS Lambda para cálculo de métricas
    Value: !Sub 'https://${DashboardMetricsApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}/metrics'
